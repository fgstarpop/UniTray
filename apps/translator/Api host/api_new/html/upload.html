<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload multi mod</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.6.0.js" integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script></head>
<body>
    
<form action="" method="post">

    <div class="form-group mt-4">
        <div class="form-check form-switch">
            <input class="form-check-input" name="is_vip" type="checkbox"
                   id="is_vip" value="1">
            <label class="form-check-label" for="is_vip">Chương vip</label>
        </div>
    </div>
    <div class="form-group mt-4 d-none price">
        <label class="col-md-12">Giá</label>
        <div class="col-md-12">
            <input type="number" class="form-control"  name="price" style="font-size: 14px;"
                   id="price">
        </div>
    </div>
    <div class="hr">

    </div>
      <div class="mb-3">
        <label for="exampleFormControlTextarea1" class="form-label">Noi Dung</label>
        <textarea class="form-control" id="listtext" name="listtext" rows="12"></textarea>
      </div>

      <button type="submit" class="btn btn-gt">Lưu lại</button>
</form>

<script>

    $(document).ready(function () {
        $('#is_vip').change(function () {
            if ($(this).is(":checked")) {
                $('.price').removeClass('d-none')
            } else {
                $('.price').addClass('d-none')
            }
        })
    });

</script>





</body>
</html>
